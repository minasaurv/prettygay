{% extends "base.html" %}

{% block title %}Page not found | pretty.gay{% endblock %}

{% block content %}
  <main id="main-content">
    <section class="error-page" aria-labelledby="error-title">
      <div class="error-code" aria-hidden="true">404</div>

      <div class="error-copy">
        <h1 id="error-title">This page is<br><em>pretty empty<span class="pink-dot">...</span></em></h1>
        <p class="error-message">The page you are looking for does not exist, or has wandered off somewhere fabulous.</p>
        <a class="button button-primary" href="{% url 'home' %}">
          go home <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
      </div>
    </section>
  </main>
{% endblock %}
